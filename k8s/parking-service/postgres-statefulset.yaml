apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: parking-postgres
spec:
  serviceName: parking-postgres
  replicas: 1
  selector:
    matchLabels:
      app: parking-postgres
  template:
    metadata:
      labels:
        app: parking-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: parking-db-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
